name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create or update preview
        id: preview
        run: |
          out=$(npx wrangler preview --name "$PREVIEW_NAME" --message "${HEAD_SHA::7}" --json) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(jq -er '.preview.urls[0]' <<<"$out")
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Check preview is serving
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-all-errors \
            "${{ steps.preview.outputs.url }}/health"

      - name: Comment preview link on PR
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          body="🔍 **Preview:** $PREVIEW_URL

          Commit \`${HEAD_SHA::7}\` · updates on every push · deleted when this PR is merged or closed."
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"

  delete-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Delete preview
        run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation

      # Cloudflare sometimes reports a delete as successful but keeps serving the old preview.
      - name: Check preview is gone
        id: gone
        run: |
          url="https://${PREVIEW_NAME}-preview-test.kevins0004.workers.dev/health"
          for _ in $(seq 1 12); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$url?n=$RANDOM" || true)
            if [ "$code" = "404" ]; then
              echo "still_live=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Cloudflare reported $PREVIEW_NAME deleted, but it still returned $code after 2 minutes."
          echo "still_live=true" >> "$GITHUB_OUTPUT"

      - name: Update PR comment
        env:
          STILL_LIVE: ${{ steps.gone.outputs.still_live }}
        run: |
          body="🧹 Preview \`$PREVIEW_NAME\` was deleted when this PR was closed."
          if [ "$STILL_LIVE" = "true" ]; then
            body="$body

          ⚠️ Cloudflare reported the delete as successful, but the link was still live 2 minutes later."
          fi
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
